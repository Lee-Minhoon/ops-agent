# Copy this file to .github/workflows/request-review.yml in each repository that should be reviewed.
#
# Required secret (set on the target repository or its organization):
#   OPS_AGENT_DISPATCH_TOKEN
#     A fine-grained PAT with "Contents: Read and write" permission on the ops-agent repository.
#     Used to send the repository_dispatch event.
#
# The reviewer GitHub App must also be installed on the target repository (see the README).
#
# Note: GitHub does not allow requesting a review from a PR's own author, so PRs opened by the
# trigger person never start a review this way.

name: Request AI Review

# Runs when a specific person is requested as a reviewer on a pull request.
# Pushing new commits does not trigger a review. To run it again, re-request that person's review;
# while their review is still pending, remove them as a reviewer and add them back.
on:
  pull_request:
    types: [review_requested]

permissions: {}

jobs:
  dispatch:
    # Change the login below to the person whose review request should trigger the AI review.
    # PRs from forks are skipped (secrets are not available to fork PRs).
    if: >-
      ${{ github.event.requested_reviewer.login == 'Lee-Minhoon' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch review request to ops-agent
        env:
          GH_TOKEN: ${{ secrets.OPS_AGENT_DISPATCH_TOKEN }}
          OPS_AGENT_REPO: Lee-Minhoon/ops-agent
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$OPS_AGENT_REPO/dispatches" \
            -f "event_type=pr-review-requested" \
            -f "client_payload[repo]=$REPO" \
            -F "client_payload[pr_number]=$PR_NUM"
